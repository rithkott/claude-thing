<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Car Thing Emulator</title>
  <link rel="stylesheet" href="faceplate.css" />
</head>
<body>
  <div class="stage">
    <div class="device">
      <!-- top edge buttons -->
      <div class="top-edge">
        <button class="preset" data-key="1" data-code="Digit1" title="Preset 1 (key 1)"><span></span></button>
        <button class="preset" data-key="2" data-code="Digit2" title="Preset 2 (key 2)"><span></span></button>
        <button class="preset" data-key="3" data-code="Digit3" title="Preset 3 (key 3)"><span></span></button>
        <button class="preset" data-key="4" data-code="Digit4" title="Preset 4 (key 4)"><span></span></button>
        <button class="settings" data-key="m" data-code="KeyM" title="Settings / power menu (key M, hold for power)"><span></span></button>
      </div>

      <div class="face">
        <div class="screen-bezel">
          <iframe id="screen" src="/" width="800" height="480" title="Car Thing screen"></iframe>
          <div id="power-overlay" class="power-overlay hidden">
            <div class="power-msg">Powered off — click to boot</div>
          </div>
        </div>

        <div class="right-col">
          <div id="dial" class="dial" title="Dial: drag or scroll to turn, click to press (Enter / arrow keys)">
            <div id="dial-knob" class="dial-knob">
              <div class="dial-ridges"></div>
              <div class="dial-dot"></div>
            </div>
          </div>
          <button id="back-btn" class="back-btn" data-key="Escape" data-code="Escape" title="Back (Escape)"></button>
        </div>
      </div>
    </div>

    <div class="status-strip">
      <span id="st-version">firmware: …</span>
      <span id="st-zip"></span>
      <span id="st-ws" class="ws-state">ws: connecting…</span>
      <span class="hint">keys: 1–4 presets · M settings · Enter dial · Esc back · ←/→ dial turn</span>
    </div>
  </div>

  <script src="faceplate.js"></script>
</body>
</html>
